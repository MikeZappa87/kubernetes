// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`

syntax = "proto3";

package k8s.io.kubelet.pkg.apis.dra.v1;
option go_package = "k8s.io/kubelet/pkg/apis/dra/v1";

service DRAPlugin {
  // NodePrepareResources prepares several ResourceClaims
  // for use on the node. If an error is returned, the
  // response is ignored. Failures for individual claims
  // can be reported inside NodePrepareResourcesResponse.
  rpc NodePrepareResources (NodePrepareResourcesRequest)
    returns (NodePrepareResourcesResponse) {}

  // NodeUnprepareResources is the opposite of NodePrepareResources.
  // The same error handling rules apply,
  rpc NodeUnprepareResources (NodeUnprepareResourcesRequest)
    returns (NodeUnprepareResourcesResponse) {}

    // NodeConfigurePodResources configures the resources for a pod on the node.
  // The same error handling rules apply,
  rpc NodeConfigurePodResources (NodeConfigurePodResourcesRequest)
    returns (NodeConfigurePodResourcesResponse) {}

    // NodeUnconfigurePodResources reverts the per-sandbox configuration done by
    // NodeConfigurePodResources. It may be called repeatedly, including after
    // kubelet restarts, so implementations must make it idempotent. The same
    // per-claim error handling rules as NodeUnprepareResources apply.
    rpc NodeUnconfigurePodResources (NodeUnconfigurePodResourcesRequest)
        returns (NodeUnconfigurePodResourcesResponse) {}
}

message NodePrepareResourcesRequest {
     // The list of ResourceClaims that are to be prepared.
     repeated Claim claims = 1;
}

message NodePrepareResourcesResponse {
    // The ResourceClaims for which preparation was done
    // or attempted, with claim_uid as key.
    //
    // It is an error if some claim listed in NodePrepareResourcesRequest
    // does not get prepared. NodePrepareResources
    // will be called again for those that are missing.
    map<string, NodePrepareResourceResponse> claims = 1;
}

message NodePrepareResourceResponse {
    // These are the additional devices that kubelet must
    // make available via the container runtime. A claim
    // may have zero or more requests and each request
    // may have zero or more devices.
    repeated Device devices = 1;
    // If non-empty, preparing the ResourceClaim failed.
    // Devices are ignored in that case.
    string error = 2;
}

message Device {
    // The requests in the claim that this device is associated with.
    // Optional. If empty, the device is associated with all requests.
    repeated string request_names = 1;

    // The pool which contains the device. Required.
    string pool_name = 2;

    // The device itself. Required.
    string device_name = 3;

    // A single device instance may map to several CDI device IDs.
    // None is also valid.
    repeated string cdi_device_ids = 4;

    // The share ID of device.
    // Optional.
    optional string share_id = 5;
}

message NodeUnprepareResourcesRequest {
    // The list of ResourceClaims that are to be unprepared.
    repeated Claim claims = 1;
}

message NodeUnprepareResourcesResponse {
    // The ResourceClaims for which preparation was reverted.
    // The same rules as for NodePrepareResourcesResponse.claims
    // apply. In particular, all claims in the request must
    // have an entry in the response, even if that entry is nil.
    map<string, NodeUnprepareResourceResponse> claims = 1;
}

message NodeUnprepareResourceResponse {
    // If non-empty, unpreparing the ResourceClaim failed.
    string error = 1;
}

message Claim {
    // The ResourceClaim namespace (ResourceClaim.meta.Namespace).
    // This field is REQUIRED.
    string namespace = 1;
    // The UID of the Resource claim (ResourceClaim.meta.UUID).
    // This field is REQUIRED.
    string uid = 2;
    // The name of the Resource claim (ResourceClaim.meta.Name)
    // This field is REQUIRED.
    string name = 3;
}

message NodeConfigurePodResourcesRequest {
    // The list of ResourceClaims that are to be configured for the pod.
    repeated Claim claims = 1;
    // The sandbox in which the pod is running. Required.
    Sandbox sandbox = 2;
    // Selected pod identity and metadata. This deliberately excludes the pod
    // spec and status; labels and annotations are included for driver policy.
    PodMetadata pod = 3;
}

// PodMetadata contains the pod context relevant to resource configuration,
// without exposing the full core Pod API object to DRA drivers.
message PodMetadata {
    // The pod UID. Required.
    string uid = 1;
    // The pod namespace. Required.
    string namespace = 2;
    // The pod name. Required.
    string name = 3;
    // Pod labels at configuration time.
    map<string, string> labels = 4;
    // Pod annotations at configuration time. Drivers should only use
    // annotations they are authorized and configured to consume.
    map<string, string> annotations = 5;
}

message NodeConfigurePodResourcesResponse {
    // The ResourceClaims for which configuration was done
    // or attempted, with claim_uid as key.
    //
    // It is an error if some claim listed in NodeConfigurePodResourcesRequest
    // does not get configured. NodeConfigurePodResources
    // will be called again for those that are missing.
    map<string, NodeConfigurePodResourceResponse> claims = 1;
}

message NodeConfigurePodResourceResponse {
    // These are the additional devices that kubelet must
    // make available via the container runtime. A claim
    // may have zero or more requests and each request
    // may have zero or more devices.
    repeated Device devices = 1;
    // If non-empty, configuring the ResourceClaim failed.
    // Devices are ignored in that case.
    string error = 2;
}

message Sandbox {
    string netns_path = 1;
    // The runtime-assigned ID of the sandbox. Required and stable across
    // retries; drivers should use it to associate and release per-sandbox state.
    string id = 2;
}

message NodeUnconfigurePodResourcesRequest {
    // The ResourceClaims configured for this pod sandbox.
    repeated Claim claims = 1;
    // The sandbox whose configuration must be reverted.
    Sandbox sandbox = 2;
}

message NodeUnconfigurePodResourcesResponse {
    // The ResourceClaims for which configuration was reverted, keyed by claim UID.
    // Every claim in the request must have an entry, even if it has no error.
    map<string, NodeUnconfigurePodResourceResponse> claims = 1;
}

message NodeUnconfigurePodResourceResponse {
    // If non-empty, unconfiguring the ResourceClaim failed.
    string error = 1;
}